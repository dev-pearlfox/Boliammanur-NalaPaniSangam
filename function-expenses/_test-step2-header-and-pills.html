<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Step 2: Header + pills — scroll smoothness test</title>
<link rel="stylesheet" href="style.css" />
<style>
  /* Test-only: hide the spreadsheet so the header + pills bar are visible
     together, plus a tall spacer so there's still room to scroll and
     repeatedly trigger the shrink/expand transition in isolation. */
  .members-table-card { display: none !important; }
  #scroll-spacer { height: 2500px; }

  /* --- Prototype fix v2 (test file only, not yet applied to the real site) ---
     v1 scaled the button row while the CARD around it still animated its
     own padding via layout (still 1 layout-triggering property). Nesting a
     transform on the row inside a card that ALSO transforms would compound
     (multiply) their scales unpredictably, so this version puts the ENTIRE
     visual shrink on the card alone — one transform, one element, and
     everything inside (padding, buttons, text) just rides along unscaled
     and un-animated, at zero extra layout cost. */
  body.is-scrolled .members-filter-card .pill {
    padding: 8px 16px !important;
    min-height: 36px !important;
    font-size: 0.85rem !important;
  }
  body.is-scrolled .members-filter-card { padding: 16px 20px !important; }
  .members-filter-card {
    transform-origin: top center;
    transition: transform 0.2s ease, margin-top 0.2s ease, margin-bottom 0.2s ease;
  }
  body.is-scrolled .members-filter-card {
    transform: scale(0.72);
    margin-bottom: var(--pills-card-margin-collapse, 0px);
  }
</style>
</head>
<body>

<script>
  // Test-only: skip the password gate so this file can never bounce you to
  // index.html (which has nothing hidden — it's a different page).
  sessionStorage.setItem("boliammanur_unlocked", "1");
</script>

<div class="sticky-top-stack">
  <header>
    <h1>போளியம்மனூர் உறுப்பினர்கள்</h1>
  </header>

  <section class="card compact members-filter-card">
    <div class="pill-row" id="type-filter-pills">
      <button type="button" class="pill active" data-filter="all" data-label="மொத்த உறுப்பினர்கள்">மொத்த உறுப்பினர்கள்</button>
      <button type="button" class="pill" data-filter="24manai" data-label="24 Manai">24 Manai</button>
      <button type="button" class="pill" data-filter="others" data-label="Others">Others</button>
    </div>
  </section>
</div>

<main>
  <section class="card members-table-card">
    <div class="members-thead-wrap" id="members-thead-wrap">
      <table class="sheet wide members-table">
        <thead>
          <tr><th>S.No</th><th>Roll No.</th><th>பெயர்</th><th>Name</th><th>Mobile Number</th><th>Type</th><th>Avoid</th></tr>
          <tr class="filter-row">
            <td><label for="filter-sno" class="sr-only">Filter by S.No</label><input type="text" id="filter-sno" class="filter-input" placeholder="Filter" inputmode="numeric" pattern="[0-9]*" /></td>
            <td><label for="filter-roll" class="sr-only">Filter by Roll No.</label><input type="text" id="filter-roll" class="filter-input" placeholder="Filter" inputmode="numeric" pattern="[0-9]*" /></td>
            <td><label for="filter-name" class="sr-only">Filter by பெயர்</label><input type="text" id="filter-name" class="filter-input" placeholder="Filter" /></td>
            <td><label for="filter-name-en" class="sr-only">Filter by Name</label><input type="text" id="filter-name-en" class="filter-input" placeholder="Filter" /></td>
            <td><label for="filter-mobile" class="sr-only">Filter by Mobile Number</label><input type="text" id="filter-mobile" class="filter-input" placeholder="Filter" inputmode="numeric" /></td>
            <td>
              <label for="filter-type" class="sr-only">Filter by Type</label>
              <select id="filter-type" class="filter-input">
                <option value="">All</option>
                <option value="24Manai">24Manai</option>
                <option value="Others">Others</option>
              </select>
            </td>
            <td></td>
          </tr>
        </thead>
      </table>
    </div>
    <div class="table-wrap members-tbody-wrap" id="members-tbody-wrap">
      <table class="sheet wide members-table">
        <tbody id="members-body"></tbody>
        <tfoot>
          <tr id="new-member-row">
            <td id="new-m-sno" class="new-member-num"></td>
            <td id="new-m-roll" class="new-member-num"></td>
            <td><label for="new-m-name" class="sr-only">New member's பெயர்</label><input type="text" id="new-m-name" placeholder="புதிய பெயரை உள்ளிடவும்..." /></td>
            <td><label for="new-m-name-en" class="sr-only">New member's Name</label><input type="text" id="new-m-name-en" placeholder="Name" /></td>
            <td><label for="new-m-mobile" class="sr-only">New member's Mobile Number</label><input type="text" id="new-m-mobile" placeholder="Mobile" inputmode="numeric" pattern="[0-9]*" disabled /></td>
            <td>
              <label for="new-m-type" class="sr-only">New member's Type</label>
              <select id="new-m-type" disabled required>
                <option value="">Select Type…</option>
                <option value="24Manai">24Manai</option>
                <option value="Others">Others</option>
              </select>
            </td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <p class="status" id="members-status" role="status" aria-live="polite"></p>
  </section>

  <div id="scroll-spacer"></div>
</main>

<div class="totals-banner">
  <a href="index.html" class="header-link-btn">← Back</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="shared.js"></script>
<script src="members.js"></script>
<script>
  // Prototype fix (test file only) — see the <style> block above for why.
  // transform:scale() doesn't shrink the space the card reserves in the
  // page (transform is purely visual, not layout), so a negative margin
  // pulls that freed space closed — computed from the card's actual
  // rendered height (offsetHeight, which transform doesn't affect) rather
  // than guessed, since it varies by screen width / how the pills wrap.
  const PILLS_CARD_COMPACT_SCALE = 0.72; // must match the scale() value above
  function syncPillsCardCollapse() {
    const card = document.querySelector(".members-filter-card");
    if (!card) return;
    const collapse = -(card.offsetHeight * (1 - PILLS_CARD_COMPACT_SCALE));
    document.documentElement.style.setProperty("--pills-card-margin-collapse", collapse + "px");
  }
  window.addEventListener("resize", syncPillsCardCollapse);
  window.addEventListener("load", syncPillsCardCollapse);
  syncPillsCardCollapse();

  // --- Prototype fix for a separate bug found while testing (test file
  // only) --- members.js's real syncMembersStickyOffsets() measures
  // .sticky-top-stack's own offsetHeight, expecting it to auto-shrink to
  // reflect .members-filter-card's negative margin-bottom. It doesn't:
  // confirmed by direct measurement that .members-filter-card's width
  // being constrained (by max-width, or width:min(), or literally any
  // mechanism that limits it below its natural content width) stops that
  // negative margin from reducing the parent's computed height at all —
  // reproducible 100% of the time by toggling just that one property, even
  // though isolated minimal repros of "constrained width + flex-wrap +
  // negative margin" don't reproduce it, so the exact spec mechanism is
  // still unclear. Redefining the function (JS resolves the name at call
  // time, so this safely overrides what members.js's own listeners call)
  // to measure the card's actual rendered bottom edge via
  // getBoundingClientRect() instead sidesteps the auto-height computation
  // entirely — always accurate regardless of the underlying quirk.
  function syncMembersStickyOffsets() {
    const card = document.querySelector(".members-filter-card");
    if (!card) return;
    document.documentElement.style.setProperty("--members-thead-top", card.getBoundingClientRect().bottom + "px");
  }
</script>
</body>
</html>
